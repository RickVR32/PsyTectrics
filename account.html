<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FFFFFF;--bg-soft:#F4F6F9;
  --text:#0B1020;--muted:#6B7280;--muted2:#9CA3AF;
  --accent:#00D4FF;--accent-soft:rgba(0,212,255,0.08);--accent-border:rgba(0,212,255,0.25);
  --line:rgba(0,0,0,0.08);--line-strong:rgba(0,0,0,0.14);
  --serif:'Montserrat',sans-serif;--sans:'Inter',sans-serif;--mono:'Space Mono',monospace;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:300;padding-top:70px;-webkit-font-smoothing:antialiased;min-height:100vh}

nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0.85rem 2.5rem;border-bottom:1px solid rgba(255,255,255,0.06);background:#060B18;height:70px}
.nav-logo-wrap{display:flex;align-items:center;text-decoration:none}
.nav-logo-img{height:52px;width:auto;display:block}
.nav-links{display:flex;gap:2rem;list-style:none}
.nav-links a{color:rgba(255,255,255,0.55);text-decoration:none;font-family:var(--mono);font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;transition:color 0.2s}
.nav-links a:hover,.nav-links a.active{color:#fff}
.nav-cta{background:var(--accent);color:#060B18;padding:0.6rem 1.4rem;font-family:var(--mono);font-size:0.68rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;text-decoration:none;transition:opacity 0.2s}
.nav-cta:hover{opacity:0.85}
.nav-hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px;background:none;border:none}
.nav-hamburger span{display:block;width:22px;height:2px;background:rgba(255,255,255,0.7);transition:all 0.3s}
.nav-hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.nav-hamburger.open span:nth-child(2){opacity:0}
.nav-hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.nav-drawer{display:none;position:fixed;top:70px;left:0;right:0;background:#060B18;border-bottom:1px solid rgba(255,255,255,0.08);z-index:199;padding:1.2rem 1.5rem;flex-direction:column}
.nav-drawer.open{display:flex}
.nav-drawer a{color:rgba(255,255,255,0.6);text-decoration:none;font-family:var(--mono);font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;padding:0.85rem 0;border-bottom:1px solid rgba(255,255,255,0.06);transition:color 0.2s}
.nav-drawer a:last-child{border-bottom:none}
.nav-drawer a:hover,.nav-drawer a.active{color:#fff}
.nav-drawer .drawer-cta{background:var(--accent);color:#060B18;padding:0.75rem 1.2rem;font-weight:700;margin-top:0.8rem;text-align:center;border-bottom:none}

.pt-footer{background:#060B18;border-top:1px solid rgba(255,255,255,0.07);padding:2rem 3rem}
.pt-footer-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem}
.pt-footer-logo{font-family:var(--mono);font-size:0.78rem;letter-spacing:0.16em;color:rgba(255,255,255,0.5);font-weight:700}
.pt-footer-links{display:flex;gap:1.8rem;flex-wrap:wrap}
.pt-footer-links a{font-family:var(--mono);font-size:0.62rem;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.3);text-decoration:none;transition:color 0.2s}
.pt-footer-links a:hover{color:rgba(255,255,255,0.7)}
.pt-footer-note{font-family:var(--mono);font-size:0.58rem;color:rgba(255,255,255,0.2);letter-spacing:0.06em}

.page-hero{padding:5rem 3rem 4rem;border-bottom:1px solid var(--line);max-width:1200px;margin:0 auto;text-align:center}
.eyebrow{font-family:var(--mono);font-size:0.65rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:1.2rem}
.hero-title{font-family:var(--serif);font-size:clamp(2.5rem,5vw,4rem);font-weight:300;line-height:1.05;margin-bottom:1rem}
.hero-title em{font-style:italic;color:var(--accent)}
.hero-desc{color:var(--muted);font-size:0.95rem;line-height:1.85;max-width:540px;margin:0 auto}

.cards-section{max-width:1200px;margin:0 auto;padding:4rem 3rem}
.cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.report-card{background:#fff;display:flex;flex-direction:column;transition:background 0.2s;cursor:pointer;text-decoration:none;color:inherit}
.report-card:hover{background:var(--bg-soft)}
.report-card.featured{background:var(--bg-soft)}
.card-header{padding:2.5rem 2.5rem 0}
.card-badge{font-family:var(--mono);font-size:0.58rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-border);padding:0.28rem 0.75rem;display:inline-block;margin-bottom:1.5rem}
.card-header h2{font-family:var(--serif);font-size:1.6rem;font-weight:300;color:var(--text);margin-bottom:0;line-height:1.15}
.card-header h2 em{font-style:italic;color:var(--accent)}
.card-body{padding:1.2rem 2.5rem;flex:1}
.card-body p{color:var(--muted);font-size:0.86rem;line-height:1.75;margin-bottom:1.2rem}
.card-features{list-style:none;display:flex;flex-direction:column;margin-bottom:1.2rem}
.card-features li{display:flex;align-items:flex-start;gap:0.65rem;padding:0.5rem 0;border-bottom:1px solid rgba(0,0,0,0.05);font-size:0.82rem;color:var(--muted);line-height:1.5}
.card-features li:last-child{border-bottom:none}
.card-features li::before{content:'—';color:var(--accent);flex-shrink:0;font-family:var(--mono);font-size:0.72rem;margin-top:1px}
.card-note{background:var(--accent-soft);border:1px solid var(--accent-border);border-left:2px solid var(--accent);padding:0.8rem 1rem;font-size:0.74rem;color:var(--muted);line-height:1.65;margin-bottom:1.2rem}
.card-footer{padding:1.5rem 2.5rem 2.5rem}
.card-btn{display:block;width:100%;padding:1rem;text-align:center;font-family:var(--mono);font-size:0.7rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;border:none;cursor:pointer;transition:opacity 0.2s;text-decoration:none;background:var(--accent);color:#060B18}
.card-btn:hover{opacity:0.85}

.cta-strip{background:var(--bg-soft);border-top:1px solid var(--line);padding:4rem 3rem;text-align:center}
.cta-strip h2{font-family:var(--serif);font-size:clamp(1.8rem,3vw,2.5rem);font-weight:300;margin-bottom:0.75rem}
.cta-strip h2 em{font-style:italic;color:var(--accent)}
.cta-strip p{color:var(--muted);font-size:0.88rem;line-height:1.75;max-width:460px;margin:0 auto 2rem}


.cards-grid.four{grid-template-columns:repeat(2,1fr)}
.report-card.soon{cursor:default;opacity:.75}.report-card.soon:hover{background:#fff}
.soon-badge{color:var(--muted);background:var(--bg-soft);border-color:var(--line-strong)}
.soon .card-btn{background:var(--bg-soft);color:var(--muted)}
@media(max-width:900px){.cards-grid,.cards-grid.four{grid-template-columns:1fr}}
@media(max-width:768px){.page-hero{padding:4rem 1.5rem 2.5rem}.cards-section{padding:2.5rem 1.5rem}.cta-strip{padding:3rem 1.5rem}}
@media(max-width:768px){nav{padding:0.8rem 1.2rem}.nav-links{display:none}.nav-hamburger{display:flex}.pt-footer{padding:2rem 1.5rem}.pt-footer-inner{flex-direction:column;text-align:center;align-items:center}.pt-footer-links{justify-content:center}}
/* LOGO-FIX: real logo file is ~6.45:1 aspect ratio — full height renders 300px+ wide and eats the whole nav bar on phones */
@media(max-width:768px){
  .nav-logo-img,nav.pt-nav .nav-logo-img{height:38px!important;width:auto}
  nav .nav-logo-wrap,nav.pt-nav .nav-logo-wrap{
    position:absolute;left:0;right:0;top:0;height:70px;
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;z-index:1;
  }
  nav .nav-logo-wrap img,nav.pt-nav .nav-logo-wrap img{pointer-events:auto}
  nav,nav.pt-nav{justify-content:flex-end}
  nav>*:not(.nav-logo-wrap),nav.pt-nav>*:not(.nav-logo-wrap){position:relative;z-index:2}
}
@media(max-width:480px){
  .nav-logo-img,nav.pt-nav .nav-logo-img{height:32px!important}
}
@media(max-width:768px){
  nav,nav.pt-nav{flex-wrap:wrap;height:auto;min-height:70px;row-gap:4px}
  .nav-right{gap:0.5rem!important}
}

/* FOOTER-PAY: payment logos + Site by Ric (shared with client builds) */
.pt-footer-pay{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:1.6rem;padding-top:1.4rem;border-top:1px solid rgba(255,255,255,0.07)}
.pt-pay-label{display:flex;align-items:center;gap:8px;margin:0;font-family:'Space Mono',monospace;font-size:0.6rem;letter-spacing:0.16em;text-transform:uppercase;color:rgba(255,255,255,0.4)}
.pt-pay-label svg{width:14px;height:14px;stroke:#00D4FF;fill:none;stroke-width:2}
.pay-chips{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0}
.pay-card{display:block;width:51px;height:32px;border-radius:4px}
.pay-chip{display:inline-flex;align-items:center;justify-content:center;gap:5px;width:51px;height:32px;background:#fff;border-radius:4px}
.pay-chip img{display:block;height:23px;width:auto}
.pay-chip.gpay img{height:15px}
.pay-chip.klarna{background:#ffb3c7;width:auto;padding:0 9px;font-family:'Inter',sans-serif;font-size:.74rem;font-weight:700;color:#0b051d}
.pay-chip.klarna img{height:11px}
.pt-footer-bot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:1.2rem;font-family:'Space Mono',monospace;font-size:0.58rem;letter-spacing:0.06em;color:rgba(255,255,255,0.3)}
.pt-footer-bot a{color:rgba(255,255,255,0.7);text-decoration:none}
.pt-footer-bot a:hover{color:#00D4FF}
@media(max-width:768px){.pt-footer-pay,.pt-footer-bot{flex-direction:column;align-items:center;text-align:center}.pay-chips{justify-content:center}}

.acct{max-width:860px;margin:0 auto;padding:3rem 1.25rem 4rem}
.acct h1{font-family:var(--serif);font-weight:300;font-size:clamp(2rem,4vw,3rem);line-height:1.1;margin:0 0 .6rem}
.acct h1 em{font-style:italic;color:var(--accent)}
.acct h2{font-family:var(--serif);font-weight:400;font-size:1.4rem;margin:0 0 .8rem}
.acct .lead{color:var(--muted);max-width:560px;margin:0 0 1.6rem;line-height:1.7}
.panel{border:1px solid var(--line-strong);background:#fff;padding:1.6rem;margin-bottom:1.4rem}
.panel input[type=email]{width:100%;box-sizing:border-box;padding:.8rem .9rem;border:1px solid var(--line-strong);font:inherit;margin:.2rem 0 .8rem}
.abtn{background:var(--accent);color:#060B18;border:0;padding:.85rem 1.6rem;font-family:var(--mono);font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none;display:inline-block}
.abtn.ghost{background:transparent;border:1px solid var(--line-strong);color:var(--text)}
.abtn:disabled{opacity:.5;cursor:default}
.abtn:focus-visible,.panel a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.amsg{font-size:.85rem;color:var(--muted);margin-top:.6rem;min-height:1.2em}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:1fr auto;gap:.3rem 1rem;padding:.85rem 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.rows .t{font-weight:500}.rows .d{font-size:.8rem;color:var(--muted)}
.rows a{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text);align-self:center}
.lvl{font-family:var(--mono);font-size:.8rem}
.trend{display:flex;align-items:flex-end;gap:4px;height:70px;margin:.4rem 0 1rem}
.trend span{flex:1;max-width:28px;background:var(--accent);opacity:.85;min-height:4px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:1rem 0}
.plan{border:1px solid var(--line-strong);padding:1.2rem}.plan .p{font-family:var(--serif);font-size:1.8rem}.plan .p small{font-size:.8rem;color:var(--muted)}
.plan.best{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.perks{margin:.4rem 0 0;padding-left:1.1rem;line-height:1.8;color:var(--muted)}
.empty{color:var(--muted);font-size:.9rem}
.tick{display:flex;gap:.5rem;align-items:flex-start;font-size:.88rem;margin:.4rem 0}
.danger{color:#C2413A;background:none;border:0;padding:0;font:inherit;font-size:.82rem;text-decoration:underline;cursor:pointer}
@media(max-width:640px){.plans{grid-template-columns:1fr}.rows li{grid-template-columns:1fr}}
</style>
</head>

<script>
const hamburger=document.getElementById('hamburger');
const drawer=document.getElementById('navDrawer');
hamburger.addEventListener('click',function(){hamburger.classList.toggle('open');drawer.classList.toggle('open');});
drawer.querySelectorAll('a').forEach(function(link){link.addEventListener('click',function(){hamburger.classList.remove('open');drawer.classList.remove('open');});});

<script src="pt-auth.js"></script>
<script>
const view=document.getElementById('view'),lead=document.getElementById('lead');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const params=new URLSearchParams(location.search);
const TYPE={narc:'Leaning Narc',empath:'Leaning Empath',loop:'Caught in the loop',mixed:'No strong pull',zero:'Close to Zero-Point'};
const PLANS='<div class="plans"><div class="plan"><div class="t">Monthly</div><div class="p">£7.99 <small>/ month</small></div><button class="abtn" data-plan="monthly">Join monthly</button></div><div class="plan best"><div class="t">Yearly · save 38%</div><div class="p">£59 <small>/ year</small></div><button class="abtn" data-plan="yearly">Join yearly</button></div></div>';
const PERKS='<ul class="perks"><li>Every full report included: the 10-page Awareness Profile, as often as you retake it</li><li>All your results, Balance Maps and Source Codes in one place</li><li>Your level tracked over time</li><li>A monthly Balance Check reminder (email or Telegram)</li><li>First access to the games and the book</li></ul>';

function signInView(){
  lead.textContent='Sign in with your email. We send you a link: no password needed.';
  view.innerHTML=`<div class="panel"><h2>Sign in</h2><label for="em" class="d">Email address</label><input type="email" id="em" autocomplete="email" placeholder="you@example.com"/>
  <button class="abtn" id="go">Email me a sign-in link</button><div class="amsg" id="msg" role="status"></div>
  <p class="d" style="margin-top:1rem;color:var(--muted);font-size:.82rem">Use the same email you took tests or bought reports with, and they'll all show up here.</p></div>
  <div class="panel" id="membership"><h2>Membership</h2>${PERKS}<p class="d" style="color:var(--muted);font-size:.85rem;margin-top:1rem">Sign in first, then choose a plan. Cancel any time.</p></div>`;
  const go=document.getElementById('go'),msg=document.getElementById('msg');
  go.onclick=async()=>{const e=document.getElementById('em').value.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){msg.textContent='Please enter a valid email address.';return}
    go.disabled=true;msg.textContent='Sending…';
    try{await PTAuth.signIn(e,params.get('next')||'');msg.textContent='Check your inbox for a link from PsyTectrics. It may take a minute (check spam too).'}
    catch(err){go.disabled=false;msg.textContent=err.message||'Could not send the link. Please try again.'}};
}
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json',...PTAuth.authHeader(),...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Something went wrong.');return d}

async function dashboard(){
  const next=params.get('next');if(next&&next.startsWith('/')&&!next.startsWith('//')){location.replace(next);return}
  lead.textContent='Loading your results…';
  let d;try{d=await api('/api/me')}catch(e){lead.textContent=e.message;return}
  lead.innerHTML='Signed in as <strong>'+esc(d.email)+'</strong>.'+(params.get('joined')?' Welcome to membership, thank you.':'');
  const levels=d.results.filter(r=>r.level).slice(0,20).reverse();
  const trend=levels.length>1?`<p class="d" style="color:var(--muted);font-size:.82rem;margin:0">Your level over your last ${levels.length} results</p><div class="trend" aria-label="Level trend">${levels.map(r=>`<span style="height:${r.level*10}%" title="${esc(r.name)} · L${r.level} · ${fmt(r.date)}"></span>`).join('')}</div>`:'';
  const res=d.results.length?'<ul class="rows">'+d.results.map(r=>`<li><div><div class="t">${esc(r.name)} <span class="lvl">${r.level?'· L'+r.level:''}</span></div><div class="d">${fmt(r.date)}${r.type?' · '+esc(TYPE[r.type]||r.type):''}</div></div>${r.code?`<a href="test.html?code=${encodeURIComponent(r.code)}">Open map →</a>`:''}</li>`).join('')+'</ul>':'<p class="empty">No saved results yet. <a href="tests.html">Take a test</a>: while you\'re signed in, results save here automatically.</p>';
  const reps=d.reports.length?'<ul class="rows">'+d.reports.map(r=>`<li><div><div class="t">Awareness Profile report <span class="lvl">${r.level?'· L'+r.level:''}</span></div><div class="d">${fmt(r.date)}${r.type?' · '+esc(TYPE[r.type]||r.type):''}</div></div><a href="report.html?${r.session?'session_id='+encodeURIComponent(r.session):'rid='+encodeURIComponent(r.id)}">Open report →</a></li>`).join('')+'</ul>':'<p class="empty">No full reports yet.</p>';
  const m=d.member;
  const mem=m&&m.active?`<p><strong>You're a member</strong> (${esc(m.plan||'')}). ${m.cancelAtPeriodEnd?'Ends':'Renews'} ${m.renews?fmt(m.renews):''}.</p>${PERKS}<p style="margin-top:1rem"><button class="abtn ghost" id="portal">Manage billing</button></p>`
    :`${PERKS}${PLANS}<p class="d" style="color:var(--muted);font-size:.82rem">Secure payment via Stripe. Cancel any time from this page. Got a code? Add it at checkout.</p>`;
  view.innerHTML=`<div class="panel"><h2>Your results</h2>${trend}${res}</div>
  <div class="panel"><h2>Your reports</h2>${reps}<p style="margin-top:1rem"><a class="abtn" href="test.html?t=awareness-profile">${m&&m.active?'Retake the Awareness Profile (report included)':'Take the Awareness Profile'}</a></p></div>
  <div class="panel" id="membership"><h2>Membership</h2>${mem}<div class="amsg" id="mmsg" role="status"></div></div>
  <div class="panel"><h2>Settings</h2><label class="tick"><input type="checkbox" id="mk" ${d.marketing?'checked':''}/> Send me news about new tests, the games and the book. You can change this any time.</label>
  <p style="margin-top:1.2rem"><button class="abtn ghost" id="out">Sign out</button></p>
  <p style="margin-top:1.4rem"><button class="danger" id="del">Delete my saved results and login</button></p><div class="amsg" id="smsg" role="status"></div></div>`;
  const mmsg=document.getElementById('mmsg');
  view.querySelectorAll('[data-plan]').forEach(b=>b.onclick=async()=>{b.disabled=true;mmsg.textContent='Opening secure checkout…';try{const r=await api('/api/membership',{method:'POST',body:JSON.stringify({action:'subscribe',plan:b.dataset.plan})});location.href=r.url}catch(e){b.disabled=false;mmsg.textContent=e.message}});
  const p=document.getElementById('portal');if(p)p.onclick=async()=>{p.disabled=true;try{const r=await api('/api/membership',{method:'POST',body:JSON.stringify({action:'portal'})});location.href=r.url}catch(e){p.disabled=false;mmsg.textContent=e.message}};
  document.getElementById('mk').onchange=async e=>{const smsg=document.getElementById('smsg');try{await api('/api/me',{method:'POST',body:JSON.stringify({marketing:e.target.checked})});smsg.textContent='Saved.'}catch(err){smsg.textContent=err.message}};
  document.getElementById('out').onclick=async()=>{await PTAuth.signOut();signInView()};
  document.getElementById('del').onclick=async()=>{if(!confirm('Delete all your saved results and your login? Paid report records are kept for our accounts; email hello@psytectrics.com to remove those too.'))return;
    try{await api('/api/me',{method:'DELETE'});await PTAuth.signOut();lead.textContent='Done. Your saved results and login have been deleted.';view.innerHTML=''}catch(e){document.getElementById('smsg').textContent=e.message}};
  if(location.hash==='#membership')document.getElementById('membership').scrollIntoView();
}
PTAuth.ready.then(()=>{
  if(!PTAuth.client()){lead.textContent='Accounts are being set up. Check back soon.';return}
  PTAuth.user()?dashboard():signInView();
  PTAuth.client().auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_IN'&&!document.getElementById('membership')?.querySelector('[data-plan],#portal'))dashboard()});
});
</script>
<script src="pt-widgets.js" defer></script>
</body>
</html>
