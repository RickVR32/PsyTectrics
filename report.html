<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FFFFFF;--bg-soft:#F4F6F9;
  --text:#0B1020;--muted:#6B7280;--muted2:#9CA3AF;
  --accent:#00D4FF;--accent-soft:rgba(0,212,255,0.08);--accent-border:rgba(0,212,255,0.25);
  --line:rgba(0,0,0,0.08);--line-strong:rgba(0,0,0,0.14);
  --serif:'Montserrat',sans-serif;--sans:'Inter',sans-serif;--mono:'Space Mono',monospace;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:300;padding-top:70px;-webkit-font-smoothing:antialiased;min-height:100vh}

nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0.85rem 2.5rem;border-bottom:1px solid rgba(255,255,255,0.06);background:#060B18;height:70px}
.nav-logo-wrap{display:flex;align-items:center;text-decoration:none}
.nav-logo-img{height:52px;width:auto;display:block}
.nav-links{display:flex;gap:2rem;list-style:none}
.nav-links a{color:rgba(255,255,255,0.55);text-decoration:none;font-family:var(--mono);font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;transition:color 0.2s}
.nav-links a:hover,.nav-links a.active{color:#fff}
.nav-cta{background:var(--accent);color:#060B18;padding:0.6rem 1.4rem;font-family:var(--mono);font-size:0.68rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;text-decoration:none;transition:opacity 0.2s}
.nav-cta:hover{opacity:0.85}
.nav-hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px;background:none;border:none}
.nav-hamburger span{display:block;width:22px;height:2px;background:rgba(255,255,255,0.7);transition:all 0.3s}
.nav-hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.nav-hamburger.open span:nth-child(2){opacity:0}
.nav-hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.nav-drawer{display:none;position:fixed;top:70px;left:0;right:0;background:#060B18;border-bottom:1px solid rgba(255,255,255,0.08);z-index:199;padding:1.2rem 1.5rem;flex-direction:column}
.nav-drawer.open{display:flex}
.nav-drawer a{color:rgba(255,255,255,0.6);text-decoration:none;font-family:var(--mono);font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;padding:0.85rem 0;border-bottom:1px solid rgba(255,255,255,0.06);transition:color 0.2s}
.nav-drawer a:last-child{border-bottom:none}
.nav-drawer a:hover,.nav-drawer a.active{color:#fff}
.nav-drawer .drawer-cta{background:var(--accent);color:#060B18;padding:0.75rem 1.2rem;font-weight:700;margin-top:0.8rem;text-align:center;border-bottom:none}

.pt-footer{background:#060B18;border-top:1px solid rgba(255,255,255,0.07);padding:2rem 3rem}
.pt-footer-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem}
.pt-footer-logo{font-family:var(--mono);font-size:0.78rem;letter-spacing:0.16em;color:rgba(255,255,255,0.5);font-weight:700}
.pt-footer-links{display:flex;gap:1.8rem;flex-wrap:wrap}
.pt-footer-links a{font-family:var(--mono);font-size:0.62rem;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.3);text-decoration:none;transition:color 0.2s}
.pt-footer-links a:hover{color:rgba(255,255,255,0.7)}
.pt-footer-note{font-family:var(--mono);font-size:0.58rem;color:rgba(255,255,255,0.2);letter-spacing:0.06em}


.wrap{max-width:760px;margin:0 auto;padding:3.5rem 1.5rem 4rem}
.eyebrow{font-family:var(--mono);font-size:0.65rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:1rem}
.t-title{font-family:var(--serif);font-size:clamp(2.2rem,5vw,3.4rem);font-weight:300;line-height:1.05;margin-bottom:1rem}
.t-title em{font-style:italic;color:var(--accent)}
.t-intro{color:var(--muted);font-size:0.95rem;line-height:1.85;margin-bottom:2rem}
.btn{display:inline-block;background:var(--accent);color:#060B18;padding:0.95rem 2rem;font-family:var(--mono);font-size:0.72rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;text-decoration:none;border:none;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.85}.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-ghost{background:none;border:1px solid var(--line-strong);color:var(--text)}
.progress{height:3px;background:var(--line);margin-bottom:2rem}.progress>div{height:100%;background:var(--accent);width:0;transition:width .3s}
.q-count{font-family:var(--mono);font-size:0.62rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted2);margin-bottom:1rem}
.q-text{font-family:var(--serif);font-size:clamp(1.3rem,3vw,1.75rem);font-weight:300;line-height:1.35;margin-bottom:2rem;min-height:4.5em}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:2rem}
.scale button{background:var(--bg-soft);border:1px solid var(--line);padding:1rem 0.4rem;font-family:var(--sans);font-size:0.78rem;color:var(--text);cursor:pointer;line-height:1.35;transition:all .15s}
.scale button:hover{border-color:var(--accent)}.scale button.sel{background:var(--accent-soft);border-color:var(--accent);font-weight:500}
.nav-row{display:flex;justify-content:space-between;gap:1rem}
.res-card{background:var(--bg-soft);border:1px solid var(--line);padding:2rem;margin-bottom:1.5rem}
.res-label{font-family:var(--mono);font-size:0.62rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);margin-bottom:0.6rem}
.res-big{font-family:var(--serif);font-size:clamp(2rem,5vw,2.8rem);font-weight:300;line-height:1.1;margin-bottom:1rem}
.res-text{color:var(--text);font-size:0.95rem;line-height:1.85}
.bar-row{display:grid;grid-template-columns:110px 1fr 48px;align-items:center;gap:12px;margin:0.7rem 0;font-family:var(--mono);font-size:0.75rem}
.bar-bg{height:8px;background:var(--line)}.bar-bg>div{height:100%}
.bar-pct{text-align:right}
.cta-box{border:1px solid var(--accent-border);background:var(--accent-soft);border-left:3px solid var(--accent);padding:1.5rem;margin:1.5rem 0}
.cta-box p{color:var(--muted);font-size:0.88rem;line-height:1.75;margin-bottom:1rem}
.save{border:1px solid var(--line);padding:1.5rem;margin:1.5rem 0}
.save h3{font-family:var(--serif);font-weight:400;font-size:1.15rem;margin-bottom:0.4rem}
.save p{color:var(--muted);font-size:0.84rem;line-height:1.7;margin-bottom:1rem}
.save input[type=email]{width:100%;padding:0.85rem 1rem;border:1px solid var(--line-strong);font-family:var(--sans);font-size:0.9rem;margin-bottom:0.8rem}
.save label{display:flex;gap:0.6rem;align-items:flex-start;font-size:0.8rem;color:var(--muted);line-height:1.5;margin-bottom:1rem}
.save-msg{font-size:0.82rem;margin-top:0.8rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:1.5rem}
.stat{background:#fff;padding:0.9rem 1rem;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-family:var(--mono);font-size:0.6rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--serif);font-size:1.5rem;font-weight:400;line-height:1.15}
.stat .s{font-size:0.74rem;color:var(--muted2)}
.map-key{display:flex;flex-wrap:wrap;gap:0.4rem 1rem;align-items:center;font-size:0.78rem;color:var(--muted);margin-top:0.8rem}
.map-key span{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:-0.6rem}
.needs{list-style:none;display:flex;flex-direction:column;gap:0.7rem;margin:0;padding:0}
.needs li{border:1px solid var(--line);border-left:3px solid;padding:0.8rem 1rem;font-size:0.9rem;line-height:1.65;background:#fff}
.needs .nm{font-family:var(--mono);font-size:0.68rem;color:var(--muted)}
.needs .ch{font-family:var(--mono);font-size:0.7rem;color:#534AB7}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
.pay{border:2px solid var(--accent);background:var(--accent-soft);padding:1.6rem;margin:1.5rem 0;display:flex;flex-direction:column;gap:0.6rem}
.pay h3{font-family:var(--serif);font-weight:400;font-size:1.5rem;margin:0}
.pay p{color:var(--muted);font-size:0.9rem;line-height:1.7;margin:0}
.pay input[type=text],.pay input[type=email]{width:100%;padding:0.85rem 1rem;border:1px solid var(--line-strong);font-family:var(--sans);font-size:0.9rem;background:#fff}
.pay label{display:flex;gap:0.6rem;align-items:flex-start;font-size:0.8rem;color:var(--muted);line-height:1.5}
.lock{font-size:0.82rem;color:var(--muted);font-style:italic}
[hidden]{display:none!important}
.disc{font-size:0.74rem;color:var(--muted2);line-height:1.7;margin-top:2rem;border-top:1px solid var(--line);padding-top:1.2rem}
@media(max-width:600px){.scale{grid-template-columns:1fr}.scale button{padding:0.8rem;text-align:left}.bar-row{grid-template-columns:90px 1fr 40px}.wrap{padding:2.5rem 1rem 3rem}}
@media(max-width:768px){nav{padding:0.8rem 1.2rem}.nav-links{display:none}.nav-hamburger{display:flex}.pt-footer{padding:2rem 1.5rem}.pt-footer-inner{flex-direction:column;text-align:center;align-items:center}.pt-footer-links{justify-content:center}}
/* LOGO-FIX: real logo file is ~6.45:1 aspect ratio — full height renders 300px+ wide and eats the whole nav bar on phones */
@media(max-width:768px){
  .nav-logo-img,nav.pt-nav .nav-logo-img{height:38px!important;width:auto}
  nav .nav-logo-wrap,nav.pt-nav .nav-logo-wrap{
    position:absolute;left:0;right:0;top:0;height:70px;
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;z-index:1;
  }
  nav .nav-logo-wrap img,nav.pt-nav .nav-logo-wrap img{pointer-events:auto}
  nav,nav.pt-nav{justify-content:flex-end}
  nav>*:not(.nav-logo-wrap),nav.pt-nav>*:not(.nav-logo-wrap){position:relative;z-index:2}
}
@media(max-width:480px){
  .nav-logo-img,nav.pt-nav .nav-logo-img{height:32px!important}
}
@media(max-width:768px){
  nav,nav.pt-nav{flex-wrap:wrap;height:auto;min-height:70px;row-gap:4px}
  .nav-right{gap:0.5rem!important}
}

/* FOOTER-PAY: payment logos + Site by Ric (shared with client builds) */
.pt-footer-pay{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:1.6rem;padding-top:1.4rem;border-top:1px solid rgba(255,255,255,0.07)}
.pt-pay-label{display:flex;align-items:center;gap:8px;margin:0;font-family:'Space Mono',monospace;font-size:0.6rem;letter-spacing:0.16em;text-transform:uppercase;color:rgba(255,255,255,0.4)}
.pt-pay-label svg{width:14px;height:14px;stroke:#00D4FF;fill:none;stroke-width:2}
.pay-chips{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0}
.pay-card{display:block;width:51px;height:32px;border-radius:4px}
.pay-chip{display:inline-flex;align-items:center;justify-content:center;gap:5px;width:51px;height:32px;background:#fff;border-radius:4px}
.pay-chip img{display:block;height:23px;width:auto}
.pay-chip.gpay img{height:15px}
.pay-chip.klarna{background:#ffb3c7;width:auto;padding:0 9px;font-family:'Inter',sans-serif;font-size:.74rem;font-weight:700;color:#0b051d}
.pay-chip.klarna img{height:11px}
.pt-footer-bot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:1.2rem;font-family:'Space Mono',monospace;font-size:0.58rem;letter-spacing:0.06em;color:rgba(255,255,255,0.3)}
.pt-footer-bot a{color:rgba(255,255,255,0.7);text-decoration:none}
.pt-footer-bot a:hover{color:#00D4FF}
@media(max-width:768px){.pt-footer-pay,.pt-footer-bot{flex-direction:column;align-items:center;text-align:center}.pay-chips{justify-content:center}}

<script src="pt-auth.js"></script>
<script>

const app=document.getElementById('report');
const qs=new URLSearchParams(location.search),sid=qs.get('session_id'),rid=qs.get('rid');
const msg=t=>{app.innerHTML='<div class="rmsg">'+t+'</div>'};
if(!sid&&!rid){msg('This page shows your report after checkout. <a href="test.html?t=awareness-profile">Take the Awareness Profile →</a>')}
else{
  msg('Building your report…');
  const get=async()=>{if(rid){await PTAuth.ready;if(!PTAuth.user())return {ok:false,d:{error:'Please <a href="account.html?next='+encodeURIComponent(location.pathname+location.search)+'">sign in</a> to open this report.'}};}
    const r=await fetch('/api/profile-report?'+(rid?'rid='+encodeURIComponent(rid):'session_id='+encodeURIComponent(sid)),{headers:rid?PTAuth.authHeader():{}});return {ok:r.ok,d:await r.json()}};
  Promise.all([get(),fetch('tests/awareness-profile.json').then(r=>r.json())])
  .then(([res,test])=>{
    if(!res.ok)throw new Error(res.d.error||'Could not load your report.');
    const d=res.d,answers={};test.items.forEach((it,i)=>answers[it.id]=d.answers[i]);
    const R=SCEngine.score(test,answers);
    const date=new Date(d.date).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
    app.innerHTML='<div class="rbar no-print"><span>Payment received — here is your full report. Bookmark this page to come back to it.</span><button class="btn" id="prt">Save as PDF</button></div>'+SCReport.build(R,{name:d.name,date,code:d.sourceCode,logo:'pt_logo.png'},test,answers);
    app.insertAdjacentHTML('beforeend','<div data-pt-review="Awareness Profile"></div>');
    if(!document.querySelector('script[src="pt-widgets.js"]')){const w=document.createElement('script');w.src='pt-widgets.js';document.body.appendChild(w);}
    document.getElementById('prt').onclick=()=>window.print();
    history.replaceState({},'',location.pathname+(rid?'?rid='+encodeURIComponent(rid):'?session_id='+encodeURIComponent(sid)));
  }).catch(e=>msg(e.message+' If you were charged, email <a href="mailto:hello@psytectrics.com">hello@psytectrics.com</a> with your receipt and we will send your report.'));
}
const hamburger=document.getElementById('hamburger');
const drawer=document.getElementById('navDrawer');
hamburger.addEventListener('click',function(){hamburger.classList.toggle('open');drawer.classList.toggle('open');});
drawer.querySelectorAll('a').forEach(function(link){link.addEventListener('click',function(){hamburger.classList.remove('open');drawer.classList.remove('open');});});
</script>
